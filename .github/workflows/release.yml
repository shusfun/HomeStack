name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的发布标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: homestack-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  GOPROXY: https://goproxy.cn
  GOSUMDB: sum.golang.org
  GOENV: ./go.env
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布标签
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: 校验发布标签
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.HOMESTACK_UPDATE_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ secrets.HOMESTACK_UPDATE_PUBLIC_KEY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          [[ -n "$UPDATE_PRIVATE_KEY" ]] || { echo "缺少 HOMESTACK_UPDATE_PRIVATE_KEY" >&2; exit 1; }
          [[ -n "$UPDATE_PUBLIC_KEY" ]] || { echo "缺少 HOMESTACK_UPDATE_PUBLIC_KEY" >&2; exit 1; }

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.6.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: 配置 Linux 构建源与 Wails 依赖
        shell: bash
        run: |
          source /etc/os-release
          [[ -n "$VERSION_CODENAME" ]]
          case "$(dpkg --print-architecture)" in
            amd64) ubuntu_mirror="https://mirrors.ustc.edu.cn/ubuntu" ;;
            arm64) ubuntu_mirror="https://mirrors.ustc.edu.cn/ubuntu-ports" ;;
            *) echo "不支持的 Ubuntu 架构" >&2; exit 1 ;;
          esac
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: $ubuntu_mirror
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports $VERSION_CODENAME-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile --child-concurrency=2

      - name: 下载 Go 依赖
        # setup-go 以 go.sum 为指纹持久缓存 GOMODCACHE 与 GOCACHE。
        run: go mod download

      - name: 前端类型检查
        run: pnpm --dir frontend typecheck

      - name: 前端测试
        run: pnpm --dir frontend exec vitest run --maxWorkers=2 --minWorkers=1

      - name: 构建共享前端
        run: pnpm --dir frontend build

      - name: Go 测试
        run: go test -p=2 -parallel=2 ./...

      - name: 校验品牌图标
        run: go run -p=2 ./cmd/homestack-assets icons verify

      - name: 发布清单集成测试
        run: go test -p=2 -parallel=2 scripts/release-manifest.go scripts/release-manifest_test.go

      - name: 托管组件清单测试
        run: go test -p=2 -parallel=2 scripts/component-manifest.go scripts/component-manifest_test.go

      - name: 上传共享前端
        uses: actions/upload-artifact@v7
        with:
          name: homestack-web-dist
          path: internal/web/dist
          retention-days: 1

  linux-cli:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出发布标签
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: 下载共享前端
        uses: actions/download-artifact@v8
        with:
          name: homestack-web-dist
          path: internal/web/dist

      - name: 下载 Go 依赖
        # setup-go 以 go.sum 为指纹持久缓存 GOMODCACHE 与 GOCACHE。
        run: go mod download

      - name: 打包 Control 与 Agent
        shell: bash
        env:
          HOMESTACK_UPDATE_PUBLIC_KEY: ${{ secrets.HOMESTACK_UPDATE_PUBLIC_KEY }}
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh control "$RELEASE_TAG" linux "${{ matrix.arch }}"
          scripts/package-release.sh agent "$RELEASE_TAG" linux "${{ matrix.arch }}"

      - name: 上传 Linux CLI 产物
        uses: actions/upload-artifact@v7
        with:
          name: homestack-linux-cli-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出发布标签
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.6.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: 配置 Windows NSIS
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            choco install nsis --version=3.12.0 --yes --no-progress --source=https://community.chocolatey.org/api/v2/
          }
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            throw "NSIS 3.12.0 安装后仍缺少 makensis.exe"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 配置 Linux 构建源与 Wails 依赖
        if: matrix.os == 'linux'
        shell: bash
        run: |
          source /etc/os-release
          [[ -n "$VERSION_CODENAME" ]]
          case "$(dpkg --print-architecture)" in
            amd64) ubuntu_mirror="https://mirrors.ustc.edu.cn/ubuntu" ;;
            arm64) ubuntu_mirror="https://mirrors.ustc.edu.cn/ubuntu-ports" ;;
            *) echo "不支持的 Ubuntu 架构" >&2; exit 1 ;;
          esac
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: $ubuntu_mirror
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports $VERSION_CODENAME-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装前端依赖
        shell: bash
        run: pnpm install --frozen-lockfile --child-concurrency=2

      - name: 下载 Go 依赖
        # setup-go 以 go.sum 为指纹持久缓存 GOMODCACHE 与 GOCACHE。
        shell: bash
        run: go mod download

      - name: Windows 桌面端测试
        if: matrix.os == 'windows'
        shell: bash
        run: go test -p=2 -parallel=2 ./internal/desktop

      - name: 构建共享前端
        shell: bash
        run: pnpm --dir frontend build

      - name: 打包桌面端
        shell: bash
        env:
          HOMESTACK_UPDATE_PUBLIC_KEY: ${{ secrets.HOMESTACK_UPDATE_PUBLIC_KEY }}
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh desktop "$RELEASE_TAG" "${{ matrix.os }}" "${{ matrix.arch }}"

      - name: 上传桌面端产物
        uses: actions/upload-artifact@v7
        with:
          name: homestack-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  publish:
    needs: [linux-cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布标签
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: 下载 Linux CLI 产物
        uses: actions/download-artifact@v8
        with:
          pattern: homestack-linux-cli-*
          path: dist
          merge-multiple: true

      - name: 下载桌面端产物
        uses: actions/download-artifact@v8
        with:
          pattern: homestack-desktop-*
          path: dist
          merge-multiple: true

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          check-latest: false
          cache: false

      - name: 生成安装更新签名与 latest.json
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.HOMESTACK_UPDATE_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ secrets.HOMESTACK_UPDATE_PUBLIC_KEY }}
        run: |
          go run scripts/release-manifest.go \
            --dist dist \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --private-key "$UPDATE_PRIVATE_KEY" \
            --public-key "$UPDATE_PUBLIC_KEY"
          test -s dist/latest.json
          signature_count=$(find dist -maxdepth 1 -type f -name '*.sig' | wc -l)
          test "$signature_count" -eq 14
          test ! -e dist/latest.json.sig
          test ! -e dist/checksums.txt

      - name: 生成托管组件签名清单
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.HOMESTACK_UPDATE_PRIVATE_KEY }}
        run: |
          IFS=$'\t' read -r probe_asset probe_size < <(go run scripts/component-manifest.go \
            --lock scripts/components.lock.json \
            --print-probe filebrowser/linux/amd64)
          [[ -n "$probe_asset" && "$probe_size" =~ ^[0-9]+$ ]]
          available=0
          fixed_update_proxy_available=0
          for candidate in "https://ghproxy.net/${probe_asset}" "https://ghfast.top/${probe_asset}" "https://gh-proxy.com/${probe_asset}" "$probe_asset"; do
            probe=$(curl -sS -L --range 0-65535 --connect-timeout 8 --max-time 20 -D - -o /dev/null -w $'\nHOMESTACK_STATUS:%{http_code}\n' "$candidate") || probe=""
            status=$(printf '%s\n' "$probe" | sed -n 's/^HOMESTACK_STATUS://p' | tail -n 1)
            content_range=$(printf '%s\n' "$probe" | tr -d '\r' | awk 'tolower($1)=="content-range:" {value=$0} END {sub(/^[^:]*:[[:space:]]*/, "", value); print value}')
            if [[ "$status" == "206" && "$content_range" == "bytes 0-65535/$probe_size" ]]; then
              available=$((available + 1))
              [[ "$candidate" != https://gh-proxy.com/* ]] || fixed_update_proxy_available=1
            else
              echo "公开组件下载节点不可用: ${candidate%%/https://*} HTTP ${status:-000} Content-Range ${content_range:-缺失}" >&2
            fi
          done
          [[ "$available" -gt 0 ]] || { echo "所有公开组件下载节点均不可用" >&2; exit 1; }
          [[ "$fixed_update_proxy_available" -eq 1 ]] || { echo "固定自动更新节点 gh-proxy.com 不可用" >&2; exit 1; }
          go run scripts/component-manifest.go \
            --output dist/components.json \
            --lock scripts/components.lock.json \
            --private-key "$UPDATE_PRIVATE_KEY"
          test -s dist/components.json
          test "$(find dist -maxdepth 1 -type f \( -name 'filebrowser_*' -o -name 'jellyfin_*' -o -name 'jellyfin-ffmpeg_*' \) | wc -l)" -eq 0

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PUBLIC_KEY: ${{ secrets.HOMESTACK_UPDATE_PUBLIC_KEY }}
        run: |
          cat > release-notes.md <<EOF
          HomeStack $RELEASE_TAG

          Linux Control 一键安装：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/$RELEASE_TAG/deploy/install.sh | sudo bash -s -- control --version "$RELEASE_TAG" --update-public-key "$UPDATE_PUBLIC_KEY"
          \`\`\`

          安装脚本会在写入系统前计算资产 SHA256，并使用所提供公钥验证 Ed25519 签名。

          Linux Agent 一键安装：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/$RELEASE_TAG/deploy/install.sh | bash -s -- agent --version "$RELEASE_TAG" --update-public-key "$UPDATE_PUBLIC_KEY"
          \`\`\`

          安装脚本会在写入系统前计算资产 SHA256，并使用所提供公钥验证 Ed25519 签名。

          桌面端推荐安装包：macOS 使用对应架构的 \`.dmg\`，Windows 使用当前用户范围的 \`_setup.exe\`，Linux 使用 AppImage 或 deb。

          自动更新通过固定公开加速地址读取本 Release，使用客户端内置或安装时提供的 Ed25519 公钥验证，不经过 HomeStack VPS。仅自动安装器和更新器实际消费的载荷附带 \`.sig\`。

          FileBrowser Quantum、Jellyfin 与 Jellyfin FFmpeg 由 App 按签名组件清单从公开候选源下载，清单固定平台、版本、大小和 SHA-256。

          当前 macOS 仅使用 ad-hoc codesign 且未公证，Windows 未做 Authenticode；Gatekeeper 或 SmartScreen 可能显示来源警告。
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "HomeStack ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
