server_url: https://mesh.example.com
listen_addr: 127.0.0.1:18080
metrics_listen_addr: null
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: true
trusted_proxies:
  - 127.0.0.1/32
  - ::1/128

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 900
    region_code: homestack
    region_name: HomeStack Self-hosted DERP
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: REPLACE_WITH_VPS_IPV4
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true

node:
  expiry: 180d
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: json

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  base_domain: tail.example.com
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /run/headscale/headscale.sock
unix_socket_permission: "0770"

oidc:
  only_start_if_oidc_is_available: true
  issuer: https://id.example.com
  client_id: REPLACE_WITH_HEADSCALE_OIDC_CLIENT_ID
  client_secret_path: /etc/headscale/oidc-client-secret
  use_expiry_from_token: false
  scope: [openid, profile, email, groups]
  email_verified_required: true
  allowed_groups: [homestack-users]
  pkce:
    enabled: true
    method: S256

logtail:
  enabled: false

taildrop:
  enabled: false

auto_update:
  enabled: false
